# Disposable Lago environment for integration tests.
#
#   npm run lago:up      start Lago, seed an organization, mint a known API key
#   npm run lago:down    stop and delete everything, including the database volume
#
# The API is published on 3210 rather than Lago's default 3000 so it cannot collide with
# something already running on the host. Postgres and Redis are deliberately not published
# at all — nothing outside the compose network needs them.
#
# The image tag is pinned rather than tracking latest, so a Lago release cannot silently
# change behaviour under the test suite. It matches the OpenAPI version the node was built
# against.
name: n8n-nodes-lago-dev

x-backend-image: &backend-image
  image: getlago/api:v1.51.0

x-backend-env: &backend-env
  DATABASE_URL: postgresql://lago:lago@db:5432/lago?search_path=public
  REDIS_URL: redis://redis:6379
  LAGO_REDIS_CACHE_URL: redis://redis:6379
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: 'true'
  SECRET_KEY_BASE: test-secret-key-base
  LAGO_ENCRYPTION_PRIMARY_KEY: test-encryption-primary-key
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: test-encryption-deterministic-key
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: test-encryption-derivation-salt
  # Signs webhook JWTs. Generated per environment by scripts/lago-dev.mjs, because Lago
  # refuses to boot without it.
  LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:?run npm run lago:up, which generates this}
  LAGO_API_URL: http://localhost:3210
  LAGO_FRONT_URL: http://localhost:3210
  # Seeds the organization, an admin membership, and an API key with a known value, so the
  # suite needs no interactive signup and no GraphQL round trip to discover its credential.
  LAGO_CREATE_ORG: 'true'
  LAGO_ORG_NAME: n8n-nodes-lago-tests
  LAGO_ORG_USER_EMAIL: admin@lago.test
  LAGO_ORG_USER_PASSWORD: supersecret
  LAGO_ORG_API_KEY: ${LAGO_ORG_API_KEY:-n8n-nodes-lago-test-key}
  # Invoice and credit-note downloads render through Gotenberg, so the service below is
  # required for them to work at all.
  LAGO_PDF_URL: http://pdf:3000
  LAGO_DISABLE_SEGMENT: 'true'

services:
  db:
    image: getlago/postgres-partman:15.0-alpine
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: lago
      PGDATA: /data/postgres
    volumes:
      - lago-db:/data/postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lago -d lago -h localhost']
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  # Migrations and org seeding run as a one-shot job rather than inside the API's start-up,
  # so a failure surfaces as a failed container with its own logs instead of an API that
  # never becomes healthy. migrate.sh runs the signup:seed_organization task when
  # LAGO_CREATE_ORG is true.
  migrate:
    <<: *backend-image
    command: ['./scripts/migrate.sh']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env

  api:
    <<: *backend-image
    command: ['./scripts/start.api.sh']
    # Lets Lago deliver webhooks to a listener on the host, which is how the trigger's
    # end-to-end test verifies a real signed delivery. Docker Desktop provides this name
    # already; on Linux it has to be mapped explicitly.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    ports:
      - '3210:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # Renders invoice and credit-note PDFs. Without it the download endpoints accept the
  # request and then fail in the background, which looks like a node bug rather than a
  # missing service.
  pdf:
    image: getlago/lago-gotenberg:7.8.2

  # Sidekiq. Billing, invoice generation and webhook delivery are all asynchronous, so
  # without this the REST calls succeed but nothing is ever produced.
  worker:
    <<: *backend-image
    command: ['./scripts/start.worker.sh']
    # Webhook delivery runs in Sidekiq, so the worker is the container that actually needs to
    # reach the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-env

volumes:
  lago-db:

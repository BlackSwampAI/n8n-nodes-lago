name: CI
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: { matrix: { node-version: ['22.22.0', '24'] } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ matrix.node-version }}', cache: npm }
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run scan:source
      - run: npm run release:check
      - run: npm run package:check
      - run: npm run smoke:load
      - run: npm run smoke:install
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.22.0', cache: npm }
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run lago:up
      - run: npm run test:integration
        env: { LAGO_DISPOSABLE_TEST_ENV: 'true' }
      - if: failure()
        run: docker compose --env-file .env.lago logs --tail 200
      - if: always()
        run: npm run lago:down
